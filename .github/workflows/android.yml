name: Android app

# Builds the AI Amalgam Android app and publishes it at
# https://github.com/Drazzurr/ai-amalgam/releases/download/android/AI-Amalgam.apk
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key
        env:
          KS_B64: ${{ secrets.AMALGAM_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.AMALGAM_KEYSTORE_PASSWORD }}
        run: |
          # A key kept in the repo's secrets wins; otherwise the sideload key in android/signing.
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/amalgam.p12"
            echo "AMALGAM_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          else
            cp android/signing/amalgam-sideload.p12 "$RUNNER_TEMP/amalgam.p12"
            echo "AMALGAM_KEYSTORE_PASSWORD=$(cat android/signing/password.txt)" >> "$GITHUB_ENV"
          fi
          echo "AMALGAM_KEYSTORE=$RUNNER_TEMP/amalgam.p12" >> "$GITHUB_ENV"

      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle -p android --no-daemon --stacktrace assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp android/app/build/outputs/apk/release/app-release.apk AI-Amalgam.apk

      - name: Publish
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --cleanup-tag -y || true
          gh release create android AI-Amalgam.apk --target "$GITHUB_SHA" --latest=false \
            --title "AI Amalgam for Android ($(cat android/VERSION))" \
            --notes "Install on your Pixel: open this page on the phone, tap AI-Amalgam.apk, then Install. Built from $GITHUB_SHA."

      - name: Save the build log (for fixing problems)
        if: always()
        run: |
          mkdir -p /tmp/log && cp "$RUNNER_TEMP/build.log" /tmp/log/build.log 2>/dev/null || echo "no log" > /tmp/log/build.log
          echo "${{ job.status }} $(cat android/VERSION) $GITHUB_SHA" > /tmp/log/result.txt
          cd /tmp/log && git init -q && git checkout -q -b android-build-log
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "build log $GITHUB_SHA"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-build-log
