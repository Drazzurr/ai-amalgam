plugins {
    id 'com.android.application'
}

// the Android app has its own version (android/VERSION), e.g. 1.9.6 -> versionCode 10906.
// It only changes when the app itself changes, so you're not asked to update it for every release.
def appVersion = file("../VERSION").text.trim()
def parts = appVersion.tokenize('.').collect { it as int }
def code = parts[0] * 10000 + parts[1] * 100 + parts[2]

android {
    namespace 'com.drazzurr.amalgam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.drazzurr.amalgam'
        minSdk 31
        targetSdk 34
        versionCode code
        versionName appVersion
    }

    signingConfigs {
        release {
            // the build server provides the signing key (kept secret); local builds use the debug key
            def ks = System.getenv("AMALGAM_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("AMALGAM_KEYSTORE_PASSWORD")
                keyAlias "amalgam"
                keyPassword System.getenv("AMALGAM_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("AMALGAM_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*',
                         'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // pairing with the phone's own Wireless debugging for the one-time keep-running setup
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
}
