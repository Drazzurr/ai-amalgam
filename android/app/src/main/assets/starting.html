<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1b1e; color: #e8e9ec;
         font: 16px/1.5 system-ui, Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 18px 0 8px; } p { color: #a3a6ad; margin: 0 auto 22px; max-width: 320px; }
  button { background: #2f8f68; color: #fff; border: 0; padding: 13px 22px; border-radius: 12px; font: 600 16px system-ui; }
  .wait { margin-top: 18px; font-size: 13.5px; color: #7d8088; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6c8cff; margin-right: 6px; animation: p 1s infinite; }
  @keyframes p { 50% { opacity: .3; } }
</style></head><body><div>
  <svg width="84" height="84" viewBox="0 0 140 140"><rect width="140" height="140" rx="32" fill="#24262a"/><ellipse cx="70" cy="70" rx="50" ry="18" transform="rotate(30 70 70)" fill="none" stroke="#e07a55" stroke-width="6"/><ellipse cx="70" cy="70" rx="50" ry="18" transform="rotate(-30 70 70)" fill="none" stroke="#1fbf85" stroke-width="6"/><circle cx="70" cy="70" r="15" fill="#6c8cff"/></svg>
  <h1>Starting AI Amalgam</h1>
  <p id="say">It runs inside the <b>Terminal</b> app, which is opening now. When the Terminal says it's running, come back here (or tap the notification).</p>
  <button onclick="AmalgamApp.openTerminal()">Open Terminal</button>
  <div class="wait"><span class="dot"></span>Waiting for AI Amalgam…</div>
</div>
<script>
  window.noTerminal = () => {
    document.getElementById("say").innerHTML = "The Terminal app isn't on this phone yet. Turn on Settings → System → Developer options → <b>Linux development environment</b>, then set up AI Amalgam in it.";
  };
  setInterval(() => { if (AmalgamApp.isUp()) AmalgamApp.goHome(); }, 1500);
</script></body></html>
